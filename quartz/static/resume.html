<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resume</title>
  <link rel="stylesheet" href="resume.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Roboto+Mono&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>

  <main id="app">
    <!-- Form Side -->
    <div class="form-and-note">
    <section id="form-section">
      <div class="glass-card">
        <h1>Interested in hiring me?</h1>
        <form id="access-form">
          <div class="input-group">
            <i class="fa-solid fa-envelope"></i>
            <input type="email" id="email" required placeholder="Email Address">
          </div>
          <div class="input-group">
            <i class="fa-solid fa-briefcase"></i>
            <select id="hire-role" required>
              <option value="" disabled selected>Role Required</option>
              <option value="development">Development/Tech Architect</option>
              <option value="security">Cyber Security(Purple Team)</option>
              <option value="devsecops">DevSecOps/Tech Architecture</option>
              <option value="other">Other</option>
            </select>
          </div>
          <button type="submit" class="btn-primary">View Resume <i
              class="fa-solid fa-arrow-right"></i></button>
        </form>
      </div>
    </section>
    <section id="note-section" class="hidden">
      <div class="note-card">
        <h3>Let's talk on <a href="https://www.linkedin.com/in/sumir-broota/" style="color: rgb(120, 209, 239);">Linkedin</a><br> or connect@sumirbroota.com first</br>
      </div>
    </section>
    </div>

    <!-- Resume Side -->
    <section id="resume-section" class="hidden">
      <div class="resume-controls no-print">
        <button id="print-btn" class="btn-secondary"><i class="fa-solid fa-print"></i> Export PDF</button>
      </div>

      <div class="resume-paper" id="resume-paper">
        <div id="resume-header"></div>
        <div id="resume-body"></div>
      </div>
    </section>
  </main>

  <script src="resume.js" type="module"></script>
</body>

</html>
